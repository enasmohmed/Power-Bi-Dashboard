{% if filter_warehouses %}
<div class="kpi-select" data-kpi-select>
    <button class="kpi-select-btn" type="button">
        <span>
            {% if selected_warehouse == 'all' or not selected_warehouse %}All Warehouses
            {% else %}{{ selected_warehouse }}{% endif %}
        </span>
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="kpi-select-menu">
        <a class="{% if selected_warehouse == 'all' or not selected_warehouse %}active{% endif %}" href="?company={{ selected_company|default:'all' }}">All Warehouses</a>
        {% for warehouse in filter_warehouses %}
        <a class="{% if selected_warehouse == warehouse %}active{% endif %}" href="?company={{ selected_company|default:'all' }}&wh={{ warehouse|urlencode }}">{{ warehouse }}</a>
        {% endfor %}
    </div>
</div>
{% endif %}
