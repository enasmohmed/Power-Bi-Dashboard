{% extends 'base-kpi.html' %}

{% block content %}
<div class="kpi-overview">
    <div class="kpi-section-head">
        <h5>Approve Users</h5>
    </div>
    <form method="post" class="kpi-approve-list">
        {% csrf_token %}
        {% for item in users %}
        <div class="kpi-approve-item">
            <div>
                <strong>{{ item.username }}</strong>
                <div class="kpi-user-email">{{ item.email }} — {{ item.role }}</div>
            </div>
            <button type="submit" class="kpi-btn" name="user_id" value="{{ item.id }}">Approve</button>
        </div>
        {% empty %}
        <div class="kpi-approve-item">No pending users.</div>
        {% endfor %}
    </form>
</div>
{% endblock %}
